name: Build Go Shared Library

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # 🌟 开启对您仓库的写入权限

jobs:
  build-linux-so:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install Build Essentials (GCC)
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc

    - name: Auto-initialize Go Module and Build
      run: |
        # 1. 自动初始化 go.mod (如果缺失)
        if [ ! -f go.mod ]; then
          echo "Initializing go module..."
          go mod init nxso
          go mod tidy
        fi

        # 2. 执行编译
        echo "Building nezha_agent.so ..."
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o nezha_agent.so .

    - name: Commit and Push Compiled SO back to Repo
      run: |
        # 3. 自动将最新编译的 .so 提交并推送到您的 main 分支，无需个人 Token！
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add nezha_agent.so
        git commit -m "chore: auto-update compiled nezha_agent.so [skip ci]" || exit 0
        git push
