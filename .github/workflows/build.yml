name: Build Go Shared Libraries

on:
  push:
    branches: [ "cfso", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bot-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nxso repo (cfso)
        uses: actions/checkout@v4

      - name: Set up Go (1.26, cloudflared 依赖)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Build Essentials (GCC, cgo 需要)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Download cloudflared binary
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x cloudflared
          ls -lh cloudflared

      - name: Resolve cloudflared dependency and build bot.so
        run: |
          cd "$GITHUB_WORKSPACE"
          go get github.com/cloudflare/cloudflared@3a2b45c2a511
          go mod tidy
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o bot.so bot.go
          ls -la bot.so

      - name: Commit and Push bot.so
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-update compiled bot.so (in-process cloudflared) [skip ci]" || exit 0
          git push origin cfso
