name: Build Go Shared Library

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux-so:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install Build Essentials
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc

    - name: Build Shared Object
      run: |
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o nezha_agent.so main.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-SO
        path: |
          nezha_agent.so
