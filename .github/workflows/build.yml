name: Build Go Shared Libraries

on:
  push:
    branches: [ "cfso", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nxso repo
        uses: actions/checkout@v4

      - name: Set up Go 1.22 (for nezha_agent.so)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Build Essentials (GCC, cgo 需要)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      # ---- nezha_agent.so：克隆 nezhahq/agent 源码，用 nxso 的 main.go 覆盖后编译 ----
      - name: Clone nezhahq/agent v2.3.0 and build nezha_agent.so
        run: |
          cd $RUNNER_TEMP
          git clone --depth=1 --branch v2.3.0 https://github.com/nezhahq/agent.git agent-src
          cp "$GITHUB_WORKSPACE/main.go" "$RUNNER_TEMP/agent-src/cmd/agent/main.go"
          cd "$RUNNER_TEMP/agent-src"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o nezha_agent.so ./cmd/agent/
          cp nezha_agent.so "$GITHUB_WORKSPACE/nezha_agent.so"

      # ---- bot.so：cloudflared 作为依赖编译进 .so，在 JVM 进程内以 goroutine 运行 ----
      # cloudflared 依赖 Go 1.26，且 go.mod 里的 replace(fork) 必须保留。
      - name: Set up Go 1.26 (for cloudflared / bot.so)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Resolve dependencies and build bot.so (in-process cloudflared)
        run: |
          cd "$GITHUB_WORKSPACE"
          go mod tidy
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o bot.so bot.go
          ls -la bot.so

      - name: Commit and Push Compiled SOs back to Repo
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nezha_agent.so bot.so go.sum
          git commit -m "chore: auto-update compiled nezha_agent.so & bot.so [skip ci]" || exit 0
          git push
