name: Build Go Shared Library

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # 🌟 开启对您仓库的写入权限

jobs:
  build-linux-so:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install Build Essentials (GCC)
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc

    - name: Assemble Source and Build
      run: |
        # 1. 备份我们写好的 CGO main.go
        mv main.go main_cgo.go

        # 2. 克隆官方哪吒探针最新仓库
        git clone --depth 1 https://github.com/nezhahq/agent.git official_agent
        
        # 3. 将官方 cmd/agent 目录下的所有辅件（连接、心跳、状态收集等）复制到当前编译目录
        cp official_agent/cmd/agent/*.go .
        
        # 4. 彻底删除官方的 main.go 和所有测试文件，避免包冲突
        rm -f main.go
        rm -f *_test.go

        # 5. 将我们备份的 CGO 核心还原为主入口 main.go
        mv main_cgo.go main.go

        # 6. 整理并初始化依赖
        if [ ! -f go.mod ]; then
          go mod init nxso
        fi
        go mod tidy

        # 7. 开始编译符合 CGO 规范的 .so 动态共享库
        echo "Building nezha_agent.so ..."
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o nezha_agent.so .

    - name: Commit and Push Compiled SO back to Repo
      run: |
        # 8. 自动将最新编译的 .so 提交并推送到您的 main 分支
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add nezha_agent.so
        git commit -m "chore: auto-update compiled nezha_agent.so [skip ci]" || exit 0
        git push
