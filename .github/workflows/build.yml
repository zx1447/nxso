name: Build Go Shared Library

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux-so:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install Build Essentials (GCC)
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc

    - name: Auto-initialize Go Module and Build
      run: |
        # 1. 如果仓库中没有 go.mod 文件，自动初始化并整理依赖
        if [ ! -f go.mod ]; then
          echo "⚠️ 未检测到 go.mod 文件，正在自动初始化模块..."
          go mod init nxso
          go mod tidy
        fi

        # 2. 执行 CGO 动态共享库编译
        echo "🚀 正在编译 .so 动态共享库..."
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o nezha_agent.so main.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-SO
        path: |
          nezha_agent.so
