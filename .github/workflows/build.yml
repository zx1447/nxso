name: Build Go Shared Library

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux-so:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install Build Essentials (GCC)
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc

    - name: Auto-initialize Go Module and Build
      run: |
        # 1. 自动初始化 go.mod (如果缺失)
        if [ ! -f go.mod ]; then
          echo "Initializing go module..."
          go mod init nxso
          go mod tidy
        fi

        # 2. 执行编译（使用 . 代表当前整个目录，避免包路径误判）
        echo "Building nezha_agent.so ..."
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o nezha_agent.so .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nezha-agent-darwin-amd64
        path: nezha_agent.so
        retention-days: 30
        overwrite: true
