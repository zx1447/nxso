name: Build bot.so

on:
  push:
    branches: [ "cfso" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bot-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nxso repo (cfso)
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Download Dependencies
        run: |
          cd "$GITHUB_WORKSPACE"
          go get github.com/cloudflare/cloudflared@3a2b45c2a511
          go mod tidy

      - name: Build bot.so (amd64)
        run: |
          cd "$GITHUB_WORKSPACE"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -buildmode=c-shared \
            -ldflags="-s -w -buildid=" \
            -trimpath \
            -o bot.so bot.go
          strip --strip-unneeded bot.so
          ls -lh bot.so bot.h

      - name: Build bot_arm64.so (arm64)
        run: |
          cd "$GITHUB_WORKSPACE"
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build \
            -buildmode=c-shared \
            -ldflags="-s -w -buildid=" \
            -trimpath \
            -o bot_arm64.so bot.go
          rm -f bot_arm64.h
          aarch64-linux-gnu-strip --strip-unneeded bot_arm64.so
          ls -lh bot_arm64.so

      - name: Commit and Push bot.so
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-update bot.so [skip ci]" || exit 0
          git push origin cfso
